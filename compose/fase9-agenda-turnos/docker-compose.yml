name: oro-fase9-agenda-turnos

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  oro-net:
    external: true

volumes:
  easyappointments-db:
  easyappointments-storage:

services:
  easyappointments-db:
    image: docker.io/library/mysql:8.0
    container_name: oro-easyappointments-db
    restart: unless-stopped
    logging: *default-logging
    networks: [oro-net]
    environment:
      MYSQL_DATABASE: easyappointments
      MYSQL_USER: easyappointments
      MYSQL_PASSWORD: ${EASYAPPOINTMENTS_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${EASYAPPOINTMENTS_DB_ROOT_PASSWORD}
    volumes:
      - easyappointments-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${EASYAPPOINTMENTS_DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  easyappointments:
    image: docker.io/alextselegidis/easyappointments:latest
    container_name: oro-easyappointments
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      easyappointments-db:
        condition: service_healthy
    networks: [oro-net]
    ports:
      - "127.0.0.1:${EASYAPPOINTMENTS_PORT:-8070}:80"
    environment:
      BASE_URL: ${EASYAPPOINTMENTS_URL:-http://localhost:8070}
      DB_HOST: easyappointments-db
      DB_NAME: easyappointments
      DB_USERNAME: easyappointments
      DB_PASSWORD: ${EASYAPPOINTMENTS_DB_PASSWORD}
      DEBUG_MODE: "false"
    volumes:
      - easyappointments-storage:/var/www/html/storage
