name: oro-fase2-legal

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  oro-net:
    external: true

volumes:
  paperless-data:
  paperless-media:
  paperless-export:
  paperless-consume:
  paperless-db:
  stirling-config:
  stirling-logs:
  docuseal-data:
  docuseal-db:

services:
  # --- Paperless-ngx: gestion documental + OCR ---
  paperless-broker:
    image: docker.io/library/redis:7
    container_name: oro-paperless-broker
    restart: unless-stopped
    logging: *default-logging
    networks: [oro-net]
    volumes:
      - paperless-data:/data

  paperless-db:
    image: docker.io/library/postgres:16
    container_name: oro-paperless-db
    restart: unless-stopped
    logging: *default-logging
    networks: [oro-net]
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: ${PAPERLESS_DB_PASSWORD}
    volumes:
      - paperless-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperless -d paperless"]
      interval: 5s
      timeout: 5s
      retries: 20

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8
    container_name: oro-gotenberg
    restart: unless-stopped
    logging: *default-logging
    networks: [oro-net]
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"

  tika:
    image: docker.io/apache/tika:latest
    container_name: oro-tika
    restart: unless-stopped
    logging: *default-logging
    networks: [oro-net]

  paperless:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: oro-paperless
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      paperless-broker:
        condition: service_started
      paperless-db:
        condition: service_healthy
      gotenberg:
        condition: service_started
      tika:
        condition: service_started
    networks: [oro-net]
    ports:
      - "127.0.0.1:${PAPERLESS_PORT:-8010}:8000"
    environment:
      PAPERLESS_REDIS: redis://paperless-broker:6379
      PAPERLESS_DBHOST: paperless-db
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${PAPERLESS_DB_PASSWORD}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY}
      PAPERLESS_URL: ${PAPERLESS_URL:-http://localhost:8010}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_OCR_LANGUAGE: spa
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD}
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-export:/usr/src/paperless/export
      - paperless-consume:/usr/src/paperless/consume

  # --- Stirling-PDF: edicion/OCR/manipulacion de PDF, sin base de datos ---
  stirling-pdf:
    image: docker.io/frooodle/s-pdf:latest
    container_name: oro-stirling-pdf
    restart: unless-stopped
    logging: *default-logging
    networks: [oro-net]
    ports:
      - "127.0.0.1:${STIRLING_PORT:-8011}:8080"
    environment:
      DOCKER_ENABLE_SECURITY: "false"
      LANGS: "es_AR"
    volumes:
      - stirling-config:/configs
      - stirling-logs:/logs

  # --- DocuSeal: firma digital de documentos ---
  docuseal-db:
    image: docker.io/library/postgres:16
    container_name: oro-docuseal-db
    restart: unless-stopped
    logging: *default-logging
    networks: [oro-net]
    environment:
      POSTGRES_DB: docuseal
      POSTGRES_USER: docuseal
      POSTGRES_PASSWORD: ${DOCUSEAL_DB_PASSWORD}
    volumes:
      - docuseal-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docuseal -d docuseal"]
      interval: 5s
      timeout: 5s
      retries: 20

  docuseal:
    image: docker.io/docuseal/docuseal:latest
    container_name: oro-docuseal
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      docuseal-db:
        condition: service_healthy
    networks: [oro-net]
    ports:
      - "127.0.0.1:${DOCUSEAL_PORT:-3005}:3000"
    environment:
      DATABASE_URL: postgres://docuseal:${DOCUSEAL_DB_PASSWORD}@docuseal-db:5432/docuseal
      SECRET_KEY_BASE: ${DOCUSEAL_SECRET_KEY_BASE}
      FORCE_SSL: "false"
    volumes:
      - docuseal-data:/data
